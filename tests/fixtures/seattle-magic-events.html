<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Seattle Magic Theater - Upcoming and past film screening events in Seattle.">
  <title>Events | Seattle Magic Theater</title>

  <!-- Shared Styles -->
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/logos/logo_black.png" sizes="48x48" type="image/png">

  <style>
    html, body {
      min-height: 100vh;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #site-header, #site-footer {
      flex-shrink: 0;
    }

    #site-header {
      position: relative;
      z-index: 10;
    }

    /* Hero Section - full width breakout */
    .hero-section {
      position: relative;
      width: calc(100% + 16em);
      margin-left: -8em;
      aspect-ratio: 11 / 4;
      overflow: hidden;
      background: #000;
      margin-top: 0.95em;
      border-top: 3px solid white;
    }

    .hero-section img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 20%;
    }


    .hero-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 3em 2em 1.5em;
      background: linear-gradient(to top,
        rgba(0,0,0,0.9) 0%,
        rgba(0,0,0,0.5) 50%,
        transparent 100%);
      display: flex;
      justify-content: center;
      z-index: 2;
    }

    .hero-overlay-inner {
      max-width: 1000px;
      width: 100%;
    }

    .hero-overlay-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 2.8em;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: #fff;
      transition: opacity 0.5s ease;
    }

    .hero-overlay-title .year {
      opacity: 0.35;
      font-weight: 400;
      font-size: 0.65em;
      margin-left: 0.1em;
    }

    .hero-overlay-director {
      font-family: var(--font-body);
      font-size: 1em;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      margin-top: 0.4em;
      letter-spacing: 0.03em;
      transition: opacity 0.5s ease;
    }

    /* Events Section */
    .events-section {
      flex: 1;
      padding: 1.44em 2em;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      overflow-x: hidden;
      font-size: clamp(1em, 0.8em + 0.5vw, 1.3em);
    }

    .section-title {
      font-size: 2.5em;
      margin-bottom: 1em;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--color-off-white);
      text-align: center;
    }

    /* Event Card */
    .event {
      display: grid;
      grid-template-columns: 18em 1fr;
      gap: 1.5em 2.5em;
      padding: 2.5em 0;
      position: relative;
      transition: all 0.3s ease;
    }

    /* Full-width event dividers with rounded ends */
    .event::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 1.5px;
      background: var(--header-line-color);
      border-radius: 0.75px;
    }

    /* Hide bottom divider on last event before past-events header and last event overall */
    .event:last-child::after,
    .past-events-header ~ .event:last-child::after {
      display: none;
    }

    /* Also hide it on the event right before the past-events header (via JS class) */
    .event.last-in-section::after {
      display: none;
    }

    .event:first-child::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 1.5px;
      background: var(--header-line-color);
      border-radius: 0.75px;
    }

    .event .poster-link {
      align-self: start;
    }

    .event img.event-poster {
      width: 100%;
      height: auto;
      border-radius: 16px;
      border: 1px solid rgba(238, 238, 238, 0.15);
      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.4),
        0 12px 48px rgba(0, 0, 0, 0.3),
        inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .event:hover img.event-poster {
      transform: translateY(-6px) scale(1.02);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.5),
        0 20px 64px rgba(0, 0, 0, 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-color: rgba(238, 238, 238, 0.25);
    }

    .event-content {
      display: flex;
      flex-direction: column;
      gap: 0.8em;
    }

    .event-title {
      margin: 0;
      font-size: 2em;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .event-title a {
      color: var(--color-off-white);
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .event-title a:hover {
      color: var(--color-primary);
    }

    .event-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5em;
      font-size: 0.95em;
      color: var(--color-text-muted);
    }

    .event-meta-item {
      display: flex;
      align-items: center;
      gap: 0.4em;
    }

    .event-meta-item .label {
      color: var(--color-primary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75em;
      letter-spacing: 0.08em;
    }

    .event-info {
      font-size: 1em;
      line-height: 1.6;
      color: var(--color-text);
    }

    .event-info .venue-logo {
      margin-left: 0.5em;
    }

    .event-info a {
      color: var(--color-text);
      text-decoration: none;
      border-bottom: 1px solid var(--color-border);
      transition: all 0.2s ease;
    }

    .event-info a:hover {
      color: var(--color-primary);
      border-color: var(--color-primary);
    }

    .event-actions {
      display: flex;
      align-items: center;
      gap: 1.5em;
      margin-top: 0.5em;
    }

    .view-link {
      color: var(--color-primary);
      font-size: 0.95em;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
    }

    .view-link::after {
      content: '→';
      transition: transform 0.25s ease;
    }

    .view-link:hover {
      color: var(--color-primary-hover);
    }

    .view-link:hover::after {
      transform: translateX(4px);
    }

    .event-director {
      font-size: 0.9em;
      color: var(--color-text-muted);
      margin-top: 0.2em;
      margin-bottom: 0.6em;
    }

    /* Ticket Form Tweaks */
    .ticket-form {
      margin-top: 0;
    }

    /* Past Events */
    .past-events-header {
      text-align: center;
      font-size: 2.5em;
      margin-top: var(--spacing-lg);
      margin-bottom: var(--spacing-md);
      color: var(--color-text-faint);
      position: relative;
      padding-top: calc(1.5px * 2 + 6px + 1em);
    }

    .past-events-header::before,
    .past-events-header::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 1.5px;
      background: var(--header-line-color, #eee);
      border-radius: 0.75px;
    }

    .past-events-header::before {
      top: 0;
    }

    .past-events-header::after {
      top: calc(1.5px + 6px);
    }

    /* Entrance animation */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .event {
      animation: fadeInUp 0.5s ease both;
    }

    /* Responsive */
    @media (max-width: 800px) {
      .hero-section {
        display: none;
      }

      .events-section {
        padding: var(--spacing-lg) 1.5em;
      }

      .section-title {
        font-size: 2em;
      }

      .event {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 1.5em;
      }

      .event .poster-link {
        grid-row: auto;
        max-width: 300px;
        justify-self: center;
      }

    }

    @media (max-width: 600px) {
      .hero-section {
        width: calc(100% + 2em);
        margin-left: -1em;
      }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <section class="hero-section" id="hero-section">
    <img src="homepage.png" alt="Seattle Magic Theater" id="hero-img">
    <div class="hero-overlay" id="hero-overlay" style="display:none;">
      <div class="hero-overlay-inner">
        <h2 class="hero-overlay-title" id="hero-title"></h2>
        <div class="hero-overlay-director" id="hero-director"></div>
      </div>
    </div>
  </section>

  <section id="events" class="events-section">
    <h2 class="section-title">Upcoming Events</h2>
    <div id="events-list">
      <!-- Loading skeleton -->
      <div class="skeleton-event">
        <div class="skeleton-poster"></div>
        <div class="skeleton-content">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line meta"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line long"></div>
          <div class="skeleton-line long"></div>
        </div>
      </div>
      <div class="skeleton-event">
        <div class="skeleton-poster"></div>
        <div class="skeleton-content">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line meta"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line long"></div>
          <div class="skeleton-line long"></div>
        </div>
      </div>
    </div>
  </section>

  <button class="back-to-top" id="back-to-top" aria-label="Back to top">&#8593;</button>

  <div id="site-footer"></div>

  <!-- Shared JavaScript -->
  <script src="shared.js"></script>
  <script>
    loadHeaderFooter();

    // Back to top button
    const backToTopBtn = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 600) {
        backToTopBtn.classList.add('visible');
      } else {
        backToTopBtn.classList.remove('visible');
      }
    });
    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Fetch and render events
    fetch('events.json')
      .then(res => res.json())
      .then(events => {
        const container = document.getElementById('events-list');
        container.innerHTML = '';

        // Split events into upcoming and past
        const upcomingEvents = events.filter(e => !isEventPast(e));
        const pastEvents = events.filter(e => isEventPast(e));

        // Sort upcoming chronologically, past reverse chronologically
        upcomingEvents.sort((a, b) => new Date(a.gcalStart) - new Date(b.gcalStart));
        pastEvents.sort((a, b) => new Date(b.gcalStart) - new Date(a.gcalStart));

        // Set hero image and start slideshow — one backdrop per upcoming event
        // Track which upcoming events have backdrops (for overlay sync)
        const heroEventPairs = upcomingEvents
          .map(e => ({ event: e, img: e.backdrop || (e.backdrops && e.backdrops[0]) }))
          .filter(p => p.img);
        const heroImages = heroEventPairs.map(p => p.img);

        function updateHeroOverlay(index) {
          const ev = heroEventPairs[index].event;
          const titleEl = document.getElementById('hero-title');
          const directorEl = document.getElementById('hero-director');
          titleEl.style.opacity = '0';
          directorEl.style.opacity = '0';
          setTimeout(() => {
            titleEl.innerHTML = `${ev.title} <span class="year">(${ev.release_year})</span>`;
            directorEl.textContent = `Directed by ${ev.director}`;
            titleEl.style.opacity = '1';
            directorEl.style.opacity = '1';
          }, 300);
        }

        if (heroImages.length > 0) {
          document.getElementById('hero-img').src = heroImages[0];
          document.getElementById('hero-img').alt = heroEventPairs[0].event.title;
          document.getElementById('hero-overlay').style.display = '';
          // Set initial overlay immediately (no fade for first one)
          const firstEv = heroEventPairs[0].event;
          document.getElementById('hero-title').innerHTML = `${firstEv.title} <span class="year">(${firstEv.release_year})</span>`;
          document.getElementById('hero-director').textContent = `Directed by ${firstEv.director}`;

          if (heroImages.length > 1) {
            startSlideshow(document.getElementById('hero-section'), heroImages, {
              interval: 5000,
              alt: 'Seattle Magic Theater Events',
              onChange: updateHeroOverlay
            });
          }
        }

        // Render an event card
        function renderEvent(event, isPast) {
          const addressHtml = formatAddress(event);
          const venueLogoHtml = getVenueLogoHtml(event.venue);

          let ticketSection;
          if (isPast) {
            ticketSection = `<div class="past-event-note">This event has passed</div>`;
          } else if (event.not_on_sale) {
            ticketSection = `
              <div class="ticket-form">
                <button class="buy-button soon" disabled aria-disabled="true" title="Tickets will be available soon">
                  On Sale Soon
                </button>
              </div>`;
          } else if (event.spt) {
            ticketSection = `
              <div class="ticket-form">
                <a class="buy-button" href="${event.externalTicketUrl}" target="_blank">Buy Tickets</a>
                <div class="mt-sm text-muted" style="font-size: 0.9em;">
                  Note: This redirects to SPT's website.
                </div>
              </div>`;
          } else {
            ticketSection = `
              <form class="ticket-form" onsubmit="return handleBuy(event, '${event.slug}', '${event.stripeAdult}', '${event.stripeStudent}')">
                <div class="ticket-column">
                  <div class="ticket-row">
                    <label>Adult <span class="ticket-price">($15)</span></label>
                    <div class="ticket-controls">
                      <button type="button" onclick="changeQty(this, -1)" aria-label="Decrease adult ticket quantity">−</button>
                      <input type="number" value="1" min="0" max="9" readonly aria-label="Adult ticket quantity">
                      <button type="button" onclick="changeQty(this, 1)" aria-label="Increase adult ticket quantity">+</button>
                    </div>
                  </div>
                  <div class="ticket-row">
                    <label>Student <span class="ticket-price">($10)</span></label>
                    <div class="ticket-controls">
                      <button type="button" onclick="changeQty(this, -1)" aria-label="Decrease student ticket quantity">−</button>
                      <input type="number" value="0" min="0" max="9" readonly aria-label="Student ticket quantity">
                      <button type="button" onclick="changeQty(this, 1)" aria-label="Increase student ticket quantity">+</button>
                    </div>
                  </div>
                  <button type="submit" class="buy-button">Buy Tickets</button>
                </div>
              </form>`;
          }

          const block = document.createElement('div');
          block.className = 'event';
          block.innerHTML = `
            <a href="movie-event.html?slug=${event.slug}" class="poster-link">
              <img class="event-poster" src="${event.poster}" alt="${event.title} Poster">
            </a>
            <div class="event-content">
              <h2 class="event-title">
                <a href="movie-event.html?slug=${event.slug}">${event.title} <span style="opacity: 0.5; font-weight: 400;">(${event.release_year})</span></a>
              </h2>
              <div class="event-director">Directed by ${event.director}</div>
              <div class="event-meta">
                <div class="event-meta-item">
                  <span class="label">Date</span>
                  <span>${event.date}</span>
                </div>
                <div class="event-meta-item">
                  <span class="label">Time</span>
                  <span>${event.time}</span>
                </div>
                <div class="event-meta-item">
                  <span class="label">Doors</span>
                  <span>${event.doors_open}</span>
                </div>
              </div>
              <div class="event-info">
                <strong>${event.venue}</strong>${venueLogoHtml ? `<span> </span>${venueLogoHtml}` : ''}<br>
                ${event.map ? `<a href="${event.map}" target="_blank">${event.address}, ${event.city}</a>` : `${event.address}, ${event.city}`}
              </div>
              <div class="event-actions">
                <a href="movie-event.html?slug=${event.slug}" class="view-link">View Details</a>
              </div>
              ${ticketSection}
            </div>
          `;
          return block;
        }

        // Render upcoming events with staggered animation
        upcomingEvents.forEach((event, i) => {
          const block = renderEvent(event, false);
          block.style.animationDelay = `${i * 0.1}s`;
          if (i === upcomingEvents.length - 1) block.classList.add('last-in-section');
          container.appendChild(block);
        });

        // Render past events section
        if (pastEvents.length > 0) {
          const pastHeader = document.createElement('h2');
          pastHeader.className = 'past-events-header';
          pastHeader.textContent = 'Past Events';
          container.appendChild(pastHeader);

          pastEvents.forEach((event, i) => {
            const block = renderEvent(event, true);
            block.style.animationDelay = `${(upcomingEvents.length + i) * 0.1}s`;
            container.appendChild(block);
          });
        }

        // If no events at all
        if (upcomingEvents.length === 0 && pastEvents.length === 0) {
          container.innerHTML = '<p class="text-muted text-center">No events scheduled. Check back soon!</p>';
        }
      })
      .catch(err => {
        console.error('Failed to load events:', err);
        document.getElementById('events-list').innerHTML = '<p>Failed to load events. Please try again later.</p>';
      });
  </script>
</body>
</html>
